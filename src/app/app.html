<div class="container">
  <h1>DOOM</h1>
  <canvas #gameCanvas width="640" height="400" tabindex="0"></canvas>

  <section class="key-guide">
    <h2>Controls</h2>
    <ul>
      <li>
        <span class="keys">
          <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd>
        </span>
        <span class="action">Movement</span>
      </li>
      <li>
        <span class="keys"><kbd>Ctrl</kbd></span>
        <span class="action">Shoot</span>
      </li>
      <li>
        <span class="keys"><kbd>Space</kbd></span>
        <span class="action">Open doors</span>
      </li>
      <li>
        <span class="keys"><kbd>Esc</kbd></span>
        <span class="action">Pause</span>
      </li>
      <li>
        <span class="keys"><kbd>Tab</kbd></span>
        <span class="action">View map</span>
      </li>
      <li>
        <span class="keys">
          <kbd>Alt</kbd><span class="sep">+</span><kbd>1</kbd><span class="sep">–</span><kbd>7</kbd>
        </span>
        <span class="action">Select gun</span>
      </li>
    </ul>
  </section>
</div>
